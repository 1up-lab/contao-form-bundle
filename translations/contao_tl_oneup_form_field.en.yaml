tl_oneup_form_field:
    title_legend: Form field
    label_legend: Label and placeholder
    help_legend: Help text
    expert_legend: Expert settings
    publish_legend: Publish settings
    config_legend: Configuration
    options_legend: Options
    type:
        - Type
        - Please select a type.
    name:
        - Name
        - Internal name for this field, will not be shown in the frontend.
    alias:
        - Alias
        - Internal representation of this field. Will be generated automatically.
    required:
        - Required
        - A * will be shown in the frontend indicating that this field is required.
    trim:
        - Trim
        - If true, the whitespace at the start and at the end of the submitted string value will be stripped.
    placeholder:
        - Placeholder
        - The placeholder attribute defines the text displayed in a form control when the control has no value.
    label:
        - Label
        - The label represents a caption for an item in a user interface.
    labelHtml:
        - Use HTML in Label
        - Will switch the label text field for an RTE field, allowing you to insert HTML elements like links.
    help:
        - Help
        - The help text will be displayed under the corresponding form field.
    helpHtml:
        - Use HTML in help
        - Will switch the label text field for an RTE field, allowing you to insert HTML elements like links.
    defaultProtocol:
        - Default Protocol
        - If no scheme is added to the url, use this protocol.
    checked:
        - Checked
        - If set, the field is checked when the form is first shown.
    value:
        - Value
        - The value that is submitted with the form.
    options:
        - Options
        - Enter the selectable options here. Leave the value empty to submit the label instead. Mark a row as a group to start a new option group.
    expanded:
        - Expanded
        - Render the options as radio buttons or checkboxes instead of a drop-down menu.
    multiple:
        - Multiple
        - Allow selecting more than one option.
    preferredChoices:
        - Preferred choices
        - These entries are shown at the top of the list, in the order selected here. They are listed in the backend language, but stored independently of it.
    duplicatePreferredChoices:
        - Repeat preferred choices
        - Also keep the preferred entries in the full list below, instead of showing them only at the top.
    alpha3:
        - Use three-letter codes
        - Submit ISO 3166-1 alpha-3 codes instead of the two-letter ones.
    html5:
        - HTML5 input
        - If set, the field is rendered as a native HTML5 input and the value has to match its format.
    multipleFiles:
        - Multiple files
        - Allow to upload more than one file.
    attachToEmail:
        - Attach to email
        - Attach the uploaded files to the email.
    storeFile:
        - Store uploaded files
        - Move the uploaded files to a folder on the server.
    uploadFolder:
        - Target folder
        - Please select the target folder from the files directory.
    useHomeDir:
        - Use home directory
        - Store the file in the home directory if there is an authenticated member.
    doNotOverwrite:
        - Preserve existing files
        - Add a numeric suffix to the new file if the file name already exists.
    addBackendLink:
        - Backend link in email
        - Add a link to the folder of the stored file in the back end file manager to the email.
    published:
        - Published
        - Output this field to the frontend.
    constraints:
        - Constraints
        - Edit the validation constraints of %s.
    types:
        texts: Text fields
        buttons: Buttons
        choices: Choices
        dates: Date and Time
        moneys: Money
        numbers: Numbers
        others: Other fields
        birthday: Birthday
        button: Button
        checkbox: Checkbox
        choice: Choice
        color: Color
        country: Country
        currency: Currency
        dateInterval: Date Interval
        dateTime: Date and Time
        date: Date
        email: E-Mail
        file: File-Upload
        group: Group
        hidden: Hidden
        integer: Integer
        language: Language
        money: Money
        number: Number
        password: Password
        percent: Percent
        radio: Radio
        range: Range
        reset: Reset
        search: Search
        step: Step
        submit: Submit
        tel: Telephone
        text: Text
        textarea: Textarea
        time: Time
        timezone: Timezone
        url: Url
        week: Week
