    subject:
        - 'Betreff'
        - 'Betreff der E-Mail.'
    emailTemplate:
        - 'E-Mail Template'
        - 'Wählen Sie ein E-Mail Template aus.'
    sendNotification:
        - 'Benachrichtigung senden'
        - 'Beim Absenden des Formulars eine Benachrichtigung über das Notification Center senden.'
