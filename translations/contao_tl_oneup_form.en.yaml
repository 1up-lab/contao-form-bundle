tl_oneup_form:
    title_legend: 'Form settings'
    redirect_legend: 'Redirect settings'
    submission_legend: 'Submission settings'
    multistep_legend: 'Multistep settings'
    email_legend: 'Email settings'
    notification_legend: 'Notification Center'
    submissions:
        - 'Submissions'
        - 'Show all submitted form data for form %s.'
    name:
        - 'Name'
        - 'Internal name for this form, will not be shown in the frontend.'
    jumpTo:
        - 'Redirect page'
        - 'Please choose the page to which visitors will be redirected after submitting the form.'
    storeSubmissions:
        - 'Store submission'
        - 'Please choose if you want to store the data of all form submissions.'
    submissionTitle:
        - 'Submission label'
        - 'Shown next to the date in the list of submissions. Use the field aliases with <code>data</code>, e.g. <code>data.firstname ~ " " ~ data.lastname ~ " · " ~ data["e-mail"]</code>. Write aliases with a hyphen in brackets. Fields a submission does not contain are empty. Changes only apply to new submissions.'
    isMultistep:
        - 'Multistep Form'
        - 'Choose if this form is a multistep.'
    sendViaEmail:
        - 'Send via email'
        - 'Send the submitted data by email.'
    mailerTransport:
        - 'Mailer transport'
        - 'Choose the transport this email is sent with.'
    recipient:
        - 'Recipient address'
        - 'Separate multiple addresses with a comma.'
    subject:
        - 'Subject'
        - 'Subject of the email.'
    emailTemplate:
        - 'Email template'
        - 'Choose an email template.'
    sendNotification:
        - 'Send notification'
        - 'Send a Notification Center notification when the form is submitted.'
    notification:
        - 'Notification'
        - 'Choose the notification to send. Messages, recipients and languages are managed in the Notification Center.'
